# Workflow name shown in the GitHub Actions UI
name: 'CodeQL'

# Static analysis of the JavaScript code (server/, public/, test/). Findings appear under
# Security > Code scanning. Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new query packs are applied to code that has not changed.
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: 'Analyze (javascript-typescript)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:javascript-typescript'
