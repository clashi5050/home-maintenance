name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the suite takes well under 2 minutes; a hang should fail fast, not run for hours
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x (moving v4 tag, pinned)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45 # multi-architecture build under emulation
    permissions:
      contents: read
      packages: write # push to GHCR (skipped on pull requests)
    outputs:
      # Digest of the multi-arch image that was pushed (empty on pull requests). The apply workflow
      # (terraform-apply.yml) deploys by digest; it finds this same image by its sha-<commit> tag.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.x (moving v3 tag, pinned)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.x (moving v3 tag, pinned)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.x (moving v3 tag, pinned)
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5.x (moving v5 tag, pinned)
        with:
          images: ghcr.io/${{ github.repository_owner }}/home-maintenance
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Scan BEFORE anything is pushed: build the amd64 image into the local Docker daemon and let
      # Trivy check it. A HIGH or CRITICAL finding that has a fix available fails the job, so an image
      # that fails the scan never reaches GHCR and can never be the one the apply workflow finds.
      # (arm64 is not scanned separately: it is built from the same Dockerfile and lockfile.)
      - name: Build image for scanning (amd64, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.x (moving v6 tag, pinned)
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: home-maintenance:scan
          cache-from: type=gha
      # ignore-unfixed: only findings that a newer package or base image can actually fix. If a fixable
      # finding truly cannot be acted on, list its ID in .trivyignore WITH a written reason and an
      # expiry date (see the header of that file); do not lower the severity instead.
      - name: Trivy image scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: home-maintenance:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          hide-progress: true

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.x (moving v6 tag, pinned)
        with:
          context: .
          # The TS-253 Pro is x86-64; arm64 is included so it also runs on Raspberry Pi / ARM NAS models.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "### Image published"
            echo
            echo "\`ghcr.io/${owner}/home-maintenance@${DIGEST}\`"
            echo
            echo "Tags: \`sha-${GITHUB_SHA::7}\`. The Azure deploy uses the digest above."
          } >> "$GITHUB_STEP_SUMMARY"
